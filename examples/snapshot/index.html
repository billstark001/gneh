<!doctype html>
<html lang="en" data-gneh-environment="visual-novel">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="No Clean Getaway — a toxic romance presented in gneh's visual-novel environment."
    />
    <title>No Clean Getaway</title>
  </head>
  <body>
    <div id="app" class="gneh-app" data-environment="visual-novel" data-scene="yard">
      <div class="scene-backdrop" aria-hidden="true"></div>
      <div class="scene-vignette" aria-hidden="true"></div>

      <header class="vn-hud">
        <div class="title-lockup">
          <span>NO CLEAN GETAWAY</span>
          <small>A GNEH VISUAL NOVEL</small>
        </div>
        <div class="route-lockup">
          <span id="route">Start</span>
          <strong id="route-title">The Dead Bird Alarm</strong>
        </div>
        <div class="metrics" aria-label="Persistent story state">
          <span>TRUST <b id="metric-trust">0</b></span>
          <span>HEAT <b id="metric-heat">0</b></span>
          <span>DEBT <b id="metric-debt">$0</b></span>
        </div>
        <button id="quick-menu" class="menu-button" type="button" aria-label="Toggle quick menu">MENU</button>
      </header>

      <main class="vn-stage">
        <div class="character-layer" aria-hidden="true">
          <img class="sprite sprite-lenora" src="/assets/lenora-sprite.png" alt="" />
          <img class="sprite sprite-mars" src="/assets/mars-sprite.png" alt="" />
        </div>

        <aside class="quick-menu" aria-label="Visual novel controls">
          <button id="undo" type="button">Back</button>
          <button id="redo" type="button">Forward</button>
          <button id="save" type="button">Quick Save</button>
          <button id="load" type="button">Quick Load</button>
          <button id="reset" type="button">Restart</button>
        </aside>

        <section id="choices" class="choice-overlay" aria-label="Choices"></section>

        <section id="dialogue-window" class="dialogue-window" aria-label="Dialogue" tabindex="0">
          <div class="dialogue-ornament" aria-hidden="true"><i></i><span>MARLOWE BAY · 02:17</span></div>
          <article id="story" aria-live="polite"></article>
          <footer class="advance-bar">
            <output id="app-status" aria-live="polite">Click the dialogue box or press Space to continue.</output>
            <span id="beat-counter">01 / 01</span>
            <button id="next" type="button" aria-label="Next line">NEXT <b>▶</b></button>
          </footer>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.mjs"></script>
  </body>
</html>
